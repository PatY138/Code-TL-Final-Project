<html>

                <a href="index.html" class="sidebarlink active">

                <a href="https://www.google.com" class="sidebarlink">

                <div id="image-preview" class="image-preview">No image selected</div>

                    <form id="chat-form" class="textboxarea" method="post" action="/predict" enctype="multipart/form-data">

                        <input id="image-upload" name="image" type="file" accept="image/*" hidden>

                    </form>
                </div>
            </div>
        </div>
